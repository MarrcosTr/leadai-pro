async function sbFetch(path,opts={}) {
  const session=getStoredSession();
  const headers={"apikey":SUPABASE_ANON,"Content-Type":"application/json",...(session?.access_token?{"Authorization":`Bearer ${session.access_token}`}:{}),...(opts.headers||{})};

  try{return{ok:res.ok,status:res.status,data:JSON.parse(text)};}

}

// ─── HELPERS ─────────────────────────────────────────────────
function timeAgo(ts) {
  const d = (Date.now()-ts)/1000;
  if(d<60) return "agora";
  if(d<3600) return `${Math.floor(d/60)}min atrás`;
  if(d<86400) return `${Math.floor(d/3600)}h atrás`;
  return `${Math.floor(d/86400)}d atrás`;
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}

function ScoreRing({ score, size=60 }) {
  const r=36,c=2*Math.PI*r,offset=c-(score/100)*c;
  const color=score>=80?"#22c55e":score>=60?"#f59e0b":"#6b7280";
  return (
    <svg width={size} height={size} viewBox="0 0 80 80">
      <circle cx="40" cy="40" r={r} fill="none" stroke="#1e1e2e" strokeWidth="8"/>
      <circle cx="40" cy="40" r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform="rotate(-90 40 40)" style={{transition:"stroke-dashoffset 1.2s ease"}}/>
      <text x="40" y="46" textAnchor="middle" fill={color} fontSize="16" fontWeight="bold">{score}</text>
    </svg>
  );
}

// ─── 4. CAMPAIGN REPORT ──────────────────────────────────────
function CampaignReport({ leads }) {
  const total    = leads.length;
  const sent     = leads.filter(l=>l.status!=="new").length;
  const replied  = leads.filter(l=>["replied","closed"].includes(l.status)).length;
  const closed   = leads.filter(l=>l.status==="closed").length;
  const convRate = sent>0 ? Math.round(closed/sent*100) : 0;
  const respRate = sent>0 ? Math.round(replied/sent*100) : 0;
  const hotCount = leads.filter(l=>l.ai_score>=80).length;

  const bars = [
    { label:"Extraídos", value:total,   color:"#6366f1", pct:100 },
    { label:"Enviados",  value:sent,    color:"#f59e0b", pct:total>0?Math.round(sent/total*100):0 },
    { label:"Respostas", value:replied, color:"#3b82f6", pct:total>0?Math.round(replied/total*100):0 },
    { label:"Fechados",  value:closed,  color:"#22c55e", pct:total>0?Math.round(closed/total*100):0 },
  ];

  return (
    <div className="px-4 mt-4">
      <div className="flex items-center justify-between mb-3">
        <h2 className="font-bold text-sm">📈 Relatório da Campanha</h2>
        <Badge text="Última busca" color="indigo"/>
      </div>
      <div className="glass rounded-2xl p-4 border border-white/5">
        {/* Funil visual */}
        <div className="space-y-3 mb-4">
          {bars.map(b=>(
            <div key={b.label} className="flex items-center gap-3">
              <span className="text-xs text-gray-400 w-16 flex-shrink-0">{b.label}</span>
              <div className="flex-1 h-5 bg-white/5 rounded-full overflow-hidden relative">
                <div className="h-full rounded-full transition-all duration-1000"
                  style={{width:`${b.pct}%`, background:`linear-gradient(90deg,${b.color}99,${b.color})`}}/>
                <span className="absolute inset-0 flex items-center px-2 text-[10px] font-bold text-white">{b.value}</span>
              </div>
              <span className="text-xs font-bold w-8 text-right" style={{color:b.color}}>{b.pct}%</span>
            </div>
          ))}
        </div>
        {/* KPIs */}
        <div className="grid grid-cols-3 gap-2 pt-3 border-t border-white/8">
          {[
            { label:"Conv. Rate",  value:`${convRate}%`,  color:"text-green-400",  icon:"🏆" },
            { label:"Resp. Rate",  value:`${respRate}%`,  color:"text-blue-400",   icon:"💬" },
            { label:"Leads Quentes",value:hotCount,       color:"text-orange-400", icon:"🔥" },
          ].map(k=>(
            <div key={k.label} className="glass rounded-xl p-2 text-center border border-white/5">
              <p className="text-sm mb-0.5">{k.icon}</p>
              <p className={`font-black text-base ${k.color}`}>{k.value}</p>
              <p className="text-gray-600 text-[10px]">{k.label}</p>
            </div>
          ))}
        </div>
        {convRate > 0 && (
          <div className="mt-3 glass rounded-xl px-3 py-2 border border-green-500/20 flex items-center gap-2">
            <span className="text-green-400">💡</span>
            <p className="text-xs text-gray-400">
              {convRate >= 20 ? "Excelente performance! Acima da média do mercado." :
               convRate >= 10 ? "Boa taxa! Continue abordando leads quentes para melhorar." :
               "Foque nos leads com Score > 80 para aumentar a conversão."}
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── AUTH SCREEN ─────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [name,setName]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");

  const submit = async () => {
    setError(""); setSuccess("");
    if(!email||(!password&&mode!=="forgot")){setError("Preencha todos os campos");return;}
    setLoading(true);
    try {
      if(mode==="login") {
        const {ok,data}=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});
        if(!ok) throw new Error(data.error_description||"Credenciais inválidas");
        storeSession(data); onAuth({session:data,user:data.user});
      } else if(mode==="signup") {
        if(!name){setError("Digite seu nome");setLoading(false);return;}
        const {ok,data}=await sbFetch("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password,data:{full_name:name}})});
        if(!ok) throw new Error(data.error_description||"Erro ao cadastrar");
        if(data.access_token){storeSession(data);onAuth({session:data,user:data.user});}
        else setSuccess("✅ Verifique seu email para confirmar!");
      } else {
        await sbFetch("/auth/v1/recover",{method:"POST",body:JSON.stringify({email})});
        setSuccess("✅ Link enviado para seu email!");
      }
    } catch(e){setError(e.message);}
    setLoading(false);
  };

  const demo = () => onAuth({session:{access_token:"demo"},user:{id:"demo",email:"demo@leadai.com",user_metadata:{full_name:"Usuário Demo"}}});

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 bg-[#0f0f1a] relative overflow-hidden fade-in">
      <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"/>
      <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"/>
      <div className="mb-8 text-center">
        <div className="w-16 h-16 gradient-btn rounded-2xl flex items-center justify-center text-3xl mb-3 mx-auto glow">🤖</div>
        <h1 className="text-3xl font-black gradient-text">LeadAI Pro</h1>
        <p className="text-gray-400 text-sm mt-1">Prospecção inteligente com IA</p>
      </div>
      <div className="glass rounded-3xl p-6 w-full max-w-sm border border-white/10">
        <div className="flex glass rounded-xl p-1 mb-5">
          {[["login","Entrar"],["signup","Cadastrar"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setError("");setSuccess("");}}
              className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${mode===m?'gradient-btn text-white':'text-gray-400'}`}>{l}</button>
          ))}
        </div>
        <div className="space-y-3">
          {mode==="signup" && (
            <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">NOME</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: João Silva"
              className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>
          )}
          <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">EMAIL</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com"
            className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>
          {mode!=="forgot" && (
            <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">SENHA</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Mínimo 8 caracteres"
              className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>
          )}
          {error && <div className="text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2 shake">{error}</div>}
          {success && <div className="text-green-400 text-xs bg-green-500/10 border border-green-500/20 rounded-xl px-3 py-2">{success}</div>}
          <button onClick={submit} disabled={loading}
            className="w-full gradient-btn rounded-2xl py-3.5 font-bold text-white flex items-center justify-center gap-2 glow disabled:opacity-50">
            {loading?<><Spinner/> Aguarde...</>:mode==="login"?"🚀 Entrar":mode==="signup"?"✨ Criar conta":"📧 Enviar link"}
          </button>
          {mode==="login" && <button onClick={()=>setMode("forgot")} className="w-full text-xs text-gray-500 hover:text-gray-300 py-1">Esqueci minha senha</button>}
          <div className="flex items-center gap-3"><div className="flex-1 h-px bg-white/10"/><span className="text-xs text-gray-600">ou</span><div className="flex-1 h-px bg-white/10"/></div>
          <button onClick={demo} className="w-full glass rounded-2xl py-3 text-sm text-gray-300 border border-white/10 hover:border-indigo-500/40 flex items-center justify-center gap-2 transition-all">
            👀 Explorar em modo demo
          </button>
        </div>
      </div>
      <p className="text-xs text-gray-600 mt-5 text-center max-w-xs">Ao criar conta você concorda com os Termos de Uso e Política de Privacidade</p>
    </div>
  );
}

// ─── PLANS SCREEN ────────────────────────────────────────────
function PlansScreen({ currentPlan, onSelect, onBack }) {
  const [loading,setLoading]=useState(null);
  const [annual,setAnnual]=useState(false);
  const select = async (plan) => {
    if(plan.id==="free"||plan.id===currentPlan) return;
    setLoading(plan.id); await new Promise(r=>setTimeout(r,1500)); onSelect(plan.id); setLoading(null);
  };
  return (
    <div className="min-h-screen bg-[#0f0f1a] pb-10 fade-in">
      <div className="sticky top-0 z-20 glass border-b border-white/10 px-4 py-3 flex items-center gap-3">
        <button onClick={onBack} className="text-gray-400 hover:text-white text-xl">←</button>
        <div><h1 className="font-bold gradient-text">Escolha seu Plano</h1><p className="text-xs text-gray-500">Cancele quando quiser</p></div>
      </div>
      <div className="px-4 pt-6">
        <div className="flex items-center justify-center gap-3 mb-6">
          <span className={`text-sm ${!annual?'text-white font-semibold':'text-gray-500'}`}>Mensal</span>
          <button onClick={()=>setAnnual(a=>!a)} className={`relative w-12 h-6 rounded-full transition-all ${annual?'bg-indigo-500':'bg-gray-700'}`}>
            <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${annual?'left-7':'left-1'}`}/>
          </button>
          <span className={`text-sm ${annual?'text-white font-semibold':'text-gray-500'}`}>Anual <Badge text="2 meses grátis" color="green"/></span>
        </div>
        <div className="space-y-4">
          {PLANS.map(plan=>{
            const isCurrent=plan.id===currentPlan;
            const price=annual&&plan.price>0?Math.round(plan.price*10*.8/12):plan.price;
            const isLoad=loading===plan.id;
            return (
              <div key={plan.id} className={`glass rounded-3xl overflow-hidden border transition-all ${plan.id==="starter"?'border-indigo-500/60 glow':isCurrent?'border-green-500/40':'border-white/10'}`}>
                {plan.badge&&<div className={`px-4 py-2 text-xs font-bold text-center ${plan.id==="pro"?'gradient-gold':'gradient-btn'} text-white`}>{plan.badge}</div>}
                <div className="p-5">
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <h2 className="font-black text-xl">{plan.label}</h2>
                      <p className="text-3xl font-black gradient-text mt-1">{price===0?"R$ 0":`R$ ${price}`}{price>0&&<span className="text-sm text-gray-400 font-normal">/mês</span>}</p>
                    </div>
                   <div className="text-right"><p className="text-2xl font-black text-indigo-400">{plan.maxLeads.toLocaleString()}</p><p className="text-xs text-gray-500">leads/mês</p></div>
                  </div>
                  <ul className="space-y-2 mb-4">{plan.features.map(f=><li key={f} className="flex items-start gap-2 text-sm text-gray-300"><span className="text-green-400 flex-shrink-0 mt-0.5">✓</span>{f}</li>)}</ul>
                  <button onClick={()=>select(plan)} disabled={isCurrent||isLoad}
                    className={`w-full rounded-2xl py-3.5 font-bold text-sm flex items-center justify-center gap-2 transition-all ${isCurrent?'bg-green-600/20 text-green-400 border border-green-500/30 cursor-default':plan.id==="pro"?'gradient-gold text-white glow-gold':plan.id==="starter"?'gradient-btn text-white glow':'glass border border-white/10 text-gray-400'}`}>
                    {isLoad?<><Spinner/> Processando...</>:isCurrent?'✅ Plano Atual':plan.cta}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
        <div className="mt-6 glass rounded-2xl p-4 border border-white/5 text-center">
          <p className="text-xs text-gray-500 font-semibold mb-2">🔒 Pagamento 100% Seguro</p>
          <div className="flex justify-center gap-4 flex-wrap">{["🛡️ SSL","💳 Stripe","🔄 Cancele a qualquer hora","📧 Nota fiscal"].map(i=><span key={i} className="text-xs text-gray-600">{i}</span>)}</div>
        </div>
      </div>
    </div>
  );
}

function SearchPage({ onLeadsFound, plan }) {
  const [form,setForm]=useState({niche:"",city:"",radius:"10",minRating:"3.5",minReviews:"20",hasWebsite:"any"});
  const [loading,setLoading]=useState(false);
  const [step,setStep]=useState("");
  const [done,setDone]=useState(false);
  const niches=["Clínica de Estética","Salão de Beleza","Restaurante","Academia","Farmácia","Odontologia","Advocacia","Contabilidade","Auto Peças","Petshop"];
  const run=async()=>{
    if(!form.niche||!form.city){alert("Preencha nicho e cidade!");return;}
    setLoading(true);setDone(false);
    const steps=["🔍 Buscando no Google Maps...","✅ 47 estabelecimentos encontrados","🧹 Filtrando por critérios...","📱 Validando números WhatsApp...","🤖 IA analisando avaliações...","✨ Score de oportunidade gerado!"];
    for(const s of steps){setStep(s);await new Promise(r=>setTimeout(r,800));}
   const serpKey = getLs("cfg_serpKey","");
const geminiKey = getLs("cfg_geminiKey","");
if(!serpKey||!geminiKey){alert("Configure suas chaves em Perfil → Configurações!");setLoading(false);return;}
try{
  const resp=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({niche:form.niche,city:form.city,minRating:form.minRating,minReviews:form.minReviews,serpKey,geminiKey})});
  const result=await resp.json();
  if(result.error)throw new Error(result.error);
  onLeadsFound(result.leads);
}catch(e){alert("Erro: "+e.message);}
setLoading(false);setDone(true);
  };
  return (
    <div className="pb-24 slide-in">
      <div className="px-4 pt-6 pb-2"><h1 className="text-xl font-bold gradient-text">🔍 Extrair Leads</h1><p className="text-gray-400 text-sm">Configure e deixa a IA trabalhar</p></div>
      {/* 5. Tip Box */}
      <div className="mt-2"><TipBox page="search"/></div>
      <div className="px-4 space-y-4">
        <div>
          <label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">NICHO *</label>
          <input value={form.niche} onChange={e=>setForm({...form,niche:e.target.value})} placeholder="Ex: Clínica de Estética..."
            className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/>
          <div className="flex flex-wrap gap-2 mt-2">
            {niches.slice(0,6).map(n=>(
              <button key={n} onClick={()=>setForm({...form,niche:n})}
                className={`text-xs px-3 py-1 rounded-full border transition-all ${form.niche===n?'border-indigo-500 bg-indigo-500/20 text-indigo-300':'border-white/10 text-gray-500 hover:border-white/30'}`}>{n}</button>
            ))}
          </div>
        </div>
        <div>
          <label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">CIDADE *</label>
          <input value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Ex: São Paulo, Campinas..."
            className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {[["radius","RAIO (KM)",["5","10","20","50"].map(v=>({v,l:`${v} km`}))],["minRating","NOTA MÍNIMA ⭐",["2","2.5","3","3.5","4","4.5"].map(v=>({v,l:`≥ ${v}`}))],["minReviews","MIN. AVALIAÇÕES",["10","20","50","100"].map(v=>({v,l:`≥ ${v}`}))],["hasWebsite","TEM SITE?",[{v:"any",l:"Qualquer"},{v:"no",l:"Sem site 🎯"},{v:"yes",l:"Com site"}]]].map(([key,label,opts])=>(
            <div key={key}>
              <label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">{label}</label>
              <select value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} className="w-full glass rounded-xl px-3 py-3 text-sm outline-none border border-white/10 bg-transparent">
                {opts.map(({v,l})=><option key={v} value={v}>{l}</option>)}
              </select>
            </div>
          ))}
        </div>
        {plan==="free"&&<div className="glass rounded-2xl p-4 border border-yellow-500/30"><p className="text-yellow-400 font-semibold text-sm mb-1">⚡ Funcionalidade Premium</p><p className="text-gray-400 text-xs mb-2">Plano Free limitado a 50 leads/mês sem análise avançada.</p><Badge text="Starter ou Pro para análise completa" color="yellow"/></div>}
        {loading&&<div className="glass rounded-2xl p-4 border border-indigo-500/30"><div className="flex items-center gap-3 mb-2"><Spinner/><p className="text-sm text-indigo-300">{step}</p></div><div className="h-1.5 bg-white/10 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full animate-pulse" style={{width:"70%"}}/></div></div>}
        {done&&<div className="glass rounded-2xl p-4 border border-green-500/30 glow-green"><p className="text-green-400 font-semibold">✅ {MOCK_LEADS.length} leads extraídos e analisados!</p><p className="text-gray-400 text-xs mt-1">Veja os resultados na aba Leads</p></div>}

          {loading?<><Spinner/> Processando...</>:<><span>🚀</span> Extrair e Analisar com IA</>}
        </button>
      </div>
    </div>
  );
}

                  <span className={`text-xs ${l.has_whatsapp?"text-green-400":"text-red-400"}`}>{l.has_whatsapp?"✓ WA":"✗ WA"}</span>
                </div>
                {(l.pain_points||[]).length>0&&<div className="mt-1.5"><Badge text={`🎯 ${l.pain_points[0]}`} color="red"/></div>}
                {/* Mini histórico */}
                {(l.history||[]).length>0&&(
                  <div className="flex items-center gap-1 mt-2 overflow-hidden">

// ─── APP ROOT ────────────────────────────────────────────────
function App() {
  const [auth,setAuth]       = useState(null);
  const [page,setPage]       = useState("dashboard");
  const [leads,setLeads]     = useState(MOCK_LEADS);
  const [plan,setPlan]       = useState("free");
  const [credits,setCredits] = useState(48);
  const [showOnboard,setShowOnboard] = useState(false);

  useEffect(()=>{
    const s=getStoredSession();
    if(s?.access_token==="demo") setAuth({session:s,user:{id:"demo",email:"demo@leadai.com",user_metadata:{full_name:"Usuário Demo"}}});
    else if(s?.user) setAuth({session:s,user:s.user});
  },[]);

  // Mostra onboarding na primeira vez
  useEffect(()=>{
    if(auth && !getLs("onboard_done",false)) setShowOnboard(true);
  },[auth]);

  const handleAuth   = (a) => { setAuth(a); storeSession({...a.session,user:a.user}); };
  const handleLogout = () => { storeSession(null); setAuth(null); setPage("dashboard"); };
  const handleOnboardDone = () => { setLs("onboard_done",true); setShowOnboard(false); };
  const handleLeadsFound  = (l) => { setLeads(l); setPage("leads"); setCredits(c=>Math.max(0,c-1)); };
  const handleStatus = (id,status) => setLeads(prev=>prev.map(l=>l.id===id?{...l,status}:l));
  const handleUpdateLead = (id,updates) => setLeads(prev=>prev.map(l=>l.id===id?{...l,...updates}:l));
  const handlePlan   = (p) => { setPlan(p); setCredits(PLANS.find(x=>x.id===p)?.credits||50); setPage("dashboard"); };

  if(!auth) return <AuthScreen onAuth={handleAuth}/>;

  if(page==="plans") return (
    <div className="min-h-screen bg-[#0f0f1a] max-w-lg mx-auto">
      <div className="fixed inset-0 pointer-events-none"><div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"/></div>
      <PlansScreen currentPlan={plan} onSelect={handlePlan} onBack={()=>setPage("profile")}/>
    </div>
  );

  return (
    <div className="min-h-screen bg-[#0f0f1a] max-w-lg mx-auto relative">
      <div className="fixed inset-0 pointer-events-none">
        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"/>
        <div className="absolute bottom-20 right-0 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl"/>
      </div>
      {/* 1. Onboarding */}
      {showOnboard && <OnboardingModal onDone={handleOnboardDone}/>}
      <div className="relative z-10">
        {page==="dashboard" && <Dashboard leads={leads} user={auth.user} plan={plan} credits={credits} onNavigate={setPage}/>}
        {page==="search"    && <SearchPage onLeadsFound={handleLeadsFound} plan={plan}/>}
        {page==="leads"     && <LeadsPage leads={leads} onStatusChange={handleStatus} onUpdateLead={handleUpdateLead}/>}
        {page==="crm"       && <CRMPage leads={leads} onStatusChange={handleStatus} onUpdateLead={handleUpdateLead}/>}
        {page==="profile"   && <ProfilePage user={auth.user} plan={plan} credits={credits} onNavigate={setPage} onLogout={handleLogout}/>}
      </div>
      <BottomNav active={page} onChange={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
